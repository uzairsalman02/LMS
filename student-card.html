<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/base.css">
    <script src="assets/js/tailwind-config.js"></script>
<title>Official Student Card - Uzair Salman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .id-card { border: 2px solid #cbd5e1 !important; box-shadow: none !important; }
        }
    </style>
</head>
<body data-lms-page="student-card" class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Top Action Bar for Print/Back -->
    <div class="w-full max-w-sm mb-6 flex justify-between items-center no-print">
        <a href="profile.html" onclick="if (window.history.length > 1) { window.history.back(); return false; }" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold px-4 py-2 rounded-xl text-xs shadow-xs transition flex items-center space-x-1.5 cursor-pointer">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Profile</span>
        </a>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2 rounded-xl text-xs shadow-md transition flex items-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-print"></i>
            <span>Print Card Now</span>
        </button>
    </div>

    <!-- Official ID Card Layout -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden id-card relative">
        
        <!-- Card Top Header Banner -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-500 p-5 text-white text-center relative">
            <div class="absolute top-3 left-3 w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center text-xs font-bold">
                CS
            </div>
            <h2 class="font-extrabold text-sm tracking-wide uppercase">EduStack LMS College</h2>
            <p class="text-[10px] text-emerald-100 uppercase tracking-wider font-semibold">Official Student Identity Card</p>
        </div>

        <!-- Card Body Content -->
        <div class="p-6 text-center space-y-4">
            
            <!-- Student Avatar / Initials -->
            <div class="relative -mt-12 mb-3 inline-block">
                <div class="w-24 h-24 rounded-full bg-white p-1.5 shadow-md mx-auto">
                    <div class="w-full h-full rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 text-white font-bold text-2xl flex items-center justify-center shadow-inner">
                        US
                    </div>
                </div>
                <span class="absolute bottom-1 right-2 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></span>
            </div>

            <div>
                <h3 class="font-extrabold text-slate-900 text-lg leading-tight">Uzair Salman</h3>
                <p class="text-xs text-slate-500 font-semibold mt-0.5">11th Standard • Computer Science</p>
            </div>

            <!-- Details Grid -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-left space-y-2 text-xs">
                <div class="flex justify-between">
                    <span class="text-slate-400 font-semibold">Roll Number:</span>
                    <span class="font-bold font-mono text-slate-800">CS-11-2026-04</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400 font-semibold">Date of Birth:</span>
                    <span class="font-bold text-slate-800">24 Oct 1989</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400 font-semibold">Valid Academic Term:</span>
                    <span class="font-bold text-slate-800">Annual 2026 - 2027</span>
                </div>
            </div>

            <!-- Barcode & Authority Signature -->
            <div class="pt-2 space-y-3">
                <div class="bg-white p-2 rounded-xl border border-slate-200 text-center font-mono font-bold text-slate-800 tracking-widest text-sm shadow-inner">
                    ||| | | |||| || | ||||| | ||
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-400 px-1">
                    <span>Authorized Signature</span>
                    <span class="font-bold text-slate-700">Principal, EduStack</span>
                </div>
            </div>

        </div>

    </div>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
